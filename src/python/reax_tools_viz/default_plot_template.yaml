key_molecules:
  n: 48
  per_page: 16
  abundance: mean
  degree_weight: atom_transfer
  weights:
    abundance: 0.6
    degree: 0.4
  exclude_self_loops: false

species_count:
  default_file: species_count.csv
  figure_width: 6.0
  figure_height: 4.0
  line_width: 1.8
  max_per_page: 8
  max_pages: 5
  min_per_page: 4
  page_method: default
  legend_columns: 4
  label_subscripts: true

bond_count:
  default_file: bond_count.csv
  figure_width: 6.0
  figure_height: 4.0
  line_width: 1.8
  max_per_page: 8
  min_per_page: 4
  page_method: default
  legend_columns: 4
  label_subscripts: false

atom_bonded_num_count:
  default_file: atom_bonded_num_count.csv
  figure_width: 6.0
  figure_height: 4.0
  line_width: 1.8
  max_per_page: 8
  min_per_page: 4
  page_method: default
  legend_columns: 4
  label_subscripts: false

ring_count:
  default_file: ring_count.csv
  figure_width: 5.5
  figure_height: 3.6
  line_width: 1.8
  max_per_page: 8
  min_per_page: 4
  page_method: default
  legend_columns: 4
  label_subscripts: false

reaction_events:
  max_reactions: 100
  max_per_page: 20
  max_pages: 5
  figure_width: 7.0
  row_height: 0.34
  min_height: 4.0
  color_map: YlGnBu
  alpha: 0.72
  embed_molecules: false

transfer_flow:
  weight: atom_transfer
  sort_by: atom_transfer
  default_max_molecules: 24
  default_max_reactions: 48
  filter_max_reactions: false
  filter_max_molecules: false
  filter_max_subgraphs: 3
  layout: sfdp
  dpi: 300
  title:
    enabled: true
    fontname: Arial
    fontsize: 24
    fontcolor: "#222222"
    labelloc: t
    labeljust: c
  graph:
    directed: true
    strict: false
    bgcolor: white
    rankdir: LR
    splines: spline
    overlap: "false"
    outputorder: edgesfirst
    margin: "0.05"
    pad: "0.10"
    nodesep: "0.55"
    ranksep: "0.90"
    sep: "+12"
    pack: "true"
    packmode: graph
    ratio: auto
    size: ""
    K: "1.0"
    maxiter: "2000"
    start: random
  nodes:
    shape: ellipse
    style: filled
    fixedsize: "false"
    width_min: 0.7
    width_max: 2.0
    height_min: 0.35
    height_max: 0.88
    fillcolor_fixed: "#9ed9c7"
    outline_color: "#263238"
    outline_width: 1.4
    fontname: Arial
    fontsize: 20
    fontcolor: "#111111"
    label_enabled: true
  edges:
    color_map: YlGnBu
    color_low: 0.2
    color_high: 1.0
    width_min: 2.0
    width_max: 6.0
    alpha: 0.75
    arrowsize_min: 1.0
    arrowsize_max: 2.0
    arrowhead: vee
    style: solid
    constraint: "true"
    weight_graphviz_min: 1.0
    weight_graphviz_max: 10.0
  edge_labels:
    enabled: true
    top_edges_for_labelling: 24
    field: atom_transfer
    format: "{value:.0f}"
    fontname: Arial
    fontsize: 14
    fontcolor: "#333333"
    decorate: "false"
    labeldistance: "1.6"
    labelangle: "0"

center_flow:
  weight: atom_transfer
  centers: 5
  depth: 1
  max_in: auto
  max_out: auto
  focus_max_visible_species: 12
  figure_width: 7.6
  figure_height: 5.0
  color_map: fresh
  alpha: 0.56
  arrow_width_min: 1.8
  arrow_width_max: 7.5
  plain_node_width: 1.02
  plain_node_height: 0.38
  plain_focus_width: 0.92
  plain_focus_height: 0.86
  plain_row_gap: 0.11
  focus_color_position: 0.80
  source_title: source
  center_title: center
  product_title: product
  show_edge_labels: true
  edge_label_font_size: 8
  node_label_font_size: 8
  font_size: 10

flow:
  weight: atom_transfer
  role_breaks: [-0.65, -0.25, 0.25, 0.65]
  max_species_per_level: 6
  max_links: 24
  keep_terminal_species: 4
  keep_anchor_links: 4
  terminal_size_penalty: 0.65
  show_discarded_note: true
  figure_width: 8.6
  figure_height: 4.8
  color_map: fresh
  alpha: 0.56
  edge_width_min: 3.0
  edge_width_max: 16.0
  bar_width: 0.95
  max_bar_height: 3.9
  min_bar_height: 0.72
  min_segment_height: 0.17
  segment_gap: 0.035
  layer_spacing: 2.25
  label_min_height: 0.23
  inside_label_max_chars: 5
  outside_label_gap: 0.22
  font_size: 10
